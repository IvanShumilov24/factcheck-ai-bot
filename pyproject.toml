[project]
name = "pravda-pod-voprosom"
version = "0.1.0"
description = "Modular foundation for a medical information fact-checking Telegram bot."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4.0",
  "aiohttp-socks>=0.9,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "httpx[socks]>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "(^|/)tests/|(^|/)alembic/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
